services:
  - type: web
    name: coreacta-doe
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: coreacta-doe-db
          property: connectionString
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://coreacta.net/api/auth/google/callback/
      - key: GOOGLE_OAUTH_SUCCESS_URL
        value: https://coreacta.net/

databases:
  - name: coreacta-doe-db
    plan: free
    databaseName: coreacta
    user: coreacta
